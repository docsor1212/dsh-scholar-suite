# Push a version tag (e.g. `git tag v1.1.0 && git push --tags`) or run manually
# from the Actions tab to publish this skill to ClawHub.
#
# One-time setup:
#   1. Register at https://clawhub.ai, run `npm i -g clawhub && clawhub login`
#   2. Copy your token (ClawHub Settings, or `clawhub token`) and add it as the
#      repo secret `CLAWHUB_TOKEN`:
#      Settings → Secrets and variables → Actions → New repository secret
#   3. Optionally set `owner:` below to your ClawHub publisher handle.
#
# Uses ClawHub's official reusable publish workflow (provenance-verified via
# id-token). See openclaw/clawhub docs/cli.md for all inputs.
name: Publish to ClawHub
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.3
    with:
      skill_path: .
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
